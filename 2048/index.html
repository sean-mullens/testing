<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2048</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#12141c;color:#e7e9f3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{margin:0;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#f2c14e;font-weight:600}
.hud{display:flex;gap:22px;font-size:14px;color:#9aa3c7;font-variant-numeric:tabular-nums;align-items:center}
.hud b{color:#e7e9f3}
button{background:#232741;color:#e7e9f3;border:1px solid #343a5e;border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}
button:hover{background:#2c3154}
#board{position:relative;width:460px;height:460px;background:#1b1f30;border-radius:12px;border:1px solid #2a2f4a;touch-action:none}
.cell{position:absolute;width:100px;height:100px;background:#20253a;border-radius:8px}
.tile{position:absolute;width:100px;height:100px;border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:34px;font-weight:700;color:#12141c;transition:transform 110ms ease-in-out;will-change:transform}
.tile.new{animation:appear 140ms ease-out}
.tile.pop{animation:pop 140ms ease-out}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{filter:brightness(1)}50%{filter:brightness(1.6)}100%{filter:brightness(1)}}
.v2{background:#dfe3f0}.v4{background:#cfd6ee}.v8{background:#f0b27a}.v16{background:#eb984e}
.v32{background:#e8734a}.v64{background:#dd5a3c}.v128{background:#f2c14e;font-size:29px}
.v256{background:#f0b429;font-size:29px}.v512{background:#e9a900;font-size:29px}
.v1024{background:#7de2a8;font-size:23px}.v2048{background:#4fd18b;font-size:23px}
.msg{min-height:20px;color:#8f98bd;font-size:13px}
</style>
</head>
<body>
<h1>2048</h1>
<div class="hud"><span>Score <b id="score">0</b></span><span>Best <b id="best">0</b></span><button id="new">New game</button></div>
<div id="board"></div>
<div class="msg" id="msg">Arrow keys or swipe. Join the tiles to reach 2048.</div>
<script src="game.js"></script>
</body>
</html>
