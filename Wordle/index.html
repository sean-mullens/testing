<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wordle</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;
  background:#12141c;color:#e7e9f3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{margin:0;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#7de2a8;font-weight:600}
button{background:#232741;color:#e7e9f3;border:1px solid #343a5e;border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}
button:hover{background:#2c3154}
#grid{display:grid;grid-template-rows:repeat(6,58px);gap:6px}
.row{display:grid;grid-template-columns:repeat(5,58px);gap:6px}
.tile{display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;text-transform:uppercase;
  border:2px solid #2f3550;border-radius:6px;background:#171b28;transition:transform 220ms}
.tile.filled{border-color:#4a5280}
.tile.flip{transform:rotateX(180deg)}
.tile.hit{background:#3f9d6a;border-color:#3f9d6a}
.tile.near{background:#c39b33;border-color:#c39b33}
.tile.miss{background:#2b3149;border-color:#2b3149}
.row.shake{animation:shake 320ms}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
#kb{display:flex;flex-direction:column;gap:6px;align-items:center;margin-top:6px}
#kb .krow{display:flex;gap:5px}
.key{min-width:38px;height:46px;padding:0 8px;background:#3a4165;border:none;border-radius:5px;color:#e7e9f3;
  font:inherit;font-size:13px;text-transform:uppercase;cursor:pointer}
.key:hover{background:#454d76}
.key.hit{background:#3f9d6a}.key.near{background:#c39b33}.key.miss{background:#22263a;color:#6a7297}
.msg{min-height:22px;color:#8f98bd;font-size:13px}
</style>
</head>
<body>
<h1>Wordle</h1>
<div id="grid"></div>
<div class="msg" id="msg">Guess the five-letter word in six tries.</div>
<div id="kb"></div>
<button id="new">New word</button>
<script src="words.js"></script>
<script src="game.js"></script>
</body>
</html>
