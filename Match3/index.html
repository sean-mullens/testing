<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Match Three</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#12141c;color:#e7e9f3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{margin:0;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#c08bff;font-weight:600}
.hud{display:flex;gap:22px;font-size:14px;color:#9aa3c7;font-variant-numeric:tabular-nums;align-items:center}
.hud b{color:#e7e9f3}
button{background:#232741;color:#e7e9f3;border:1px solid #343a5e;border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}
button:hover{background:#2c3154}
canvas{background:#0c0e15;border:1px solid #2a2f4a;border-radius:10px;touch-action:none}
.msg{min-height:20px;color:#8f98bd;font-size:13px}
</style>
</head>
<body>
<h1>Match Three</h1>
<div class="hud"><span>Score <b id="score">0</b></span><span>Moves <b id="moves">30</b></span><button id="new">New board</button></div>
<canvas id="game" width="448" height="448"></canvas>
<div class="msg" id="msg">Swap two neighbours to line up three or more.</div>
<script src="game.js"></script>
</body>
</html>
