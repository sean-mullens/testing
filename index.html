<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tetris</title>
  <style>
    body { background:#222; color:white; font-family:sans-serif; }
    canvas { position:absolute; }
  </style>
</head>
<body>
  <canvas id="board_canvas"></canvas>
  <canvas id="animated_canvas"></canvas>
  <canvas id="shadow_canvas"></canvas>

  <div id="score-wrapper">
    Score: <span id="score">0</span>
  </div>

  <div id="instructions">
    <p id="instr">Use arrow keys to move, Z/X or up to rotate, space to hard drop, P to pause.</p>
  </div>

  <input type="range" id="sens_range" min="1" max="5" value="3">

  <div id="indicatorcontainer"></div>

  <!-- Your JS file -->
  <script src="tetris.js"></script>
</body>
</html>
