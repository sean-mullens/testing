<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nonogram</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;
  background:#12141c;color:#e7e9f3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{margin:0;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#5fd6d6;font-weight:600}
.hud{display:flex;gap:16px;font-size:14px;color:#9aa3c7;align-items:center}
button,select{background:#232741;color:#e7e9f3;border:1px solid #343a5e;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{background:#2c3154}
#wrap{display:grid;gap:4px;user-select:none}
.clue{display:flex;font-size:12px;color:#9aa3c7;line-height:1.15;gap:4px}
.clue.row{justify-content:flex-end;align-items:center;padding-right:6px}
.clue.col{flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:4px}
.clue.done{color:#3f4666}
.cell{width:30px;height:30px;background:#232840;border:1px solid #2f3550;cursor:pointer}
.cell.fill{background:#5fd6d6;border-color:#8ff0f0}
.cell.mark{background:#1a1e2e;color:#6a7297;display:flex;align-items:center;justify-content:center;font-size:14px}
.cell.edgeR{border-right-color:#525c8c}
.cell.edgeB{border-bottom-color:#525c8c}
.msg{min-height:20px;color:#8f98bd;font-size:13px}
</style>
</head>
<body>
<h1>Nonogram</h1>
<div class="hud">
  <select id="size"><option value="5">5×5</option><option value="10" selected>10×10</option><option value="15">15×15</option></select>
  <button id="new">New puzzle</button>
  <button id="clear">Clear marks</button>
</div>
<div id="wrap"></div>
<div class="msg" id="msg">Left click fills, right click marks a blank. Every puzzle here is solvable by logic alone.</div>
<script src="game.js"></script>
</body>
</html>
