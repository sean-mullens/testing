<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lights Out</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#12141c;color:#e7e9f3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{margin:0;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#f2c14e;font-weight:600}
.hud{display:flex;gap:18px;font-size:14px;color:#9aa3c7;font-variant-numeric:tabular-nums;align-items:center}
.hud b{color:#e7e9f3}
button,select{background:#232741;color:#e7e9f3;border:1px solid #343a5e;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
button:hover{background:#2c3154}
#board{display:grid;gap:10px;padding:14px;background:#1b1f30;border:1px solid #2a2f4a;border-radius:12px}
.lamp{width:66px;height:66px;border-radius:10px;background:#232840;border:1px solid #2f3550;cursor:pointer;transition:background 90ms,box-shadow 90ms}
.lamp:hover{border-color:#4a5280}
.lamp.on{background:#f2c14e;border-color:#ffdc84;box-shadow:0 0 18px rgba(242,193,78,.45)}
.msg{min-height:20px;color:#8f98bd;font-size:13px}
</style>
</head>
<body>
<h1>Lights Out</h1>
<div class="hud">
  <select id="size"><option value="5">5×5</option><option value="4">4×4</option><option value="6">6×6</option></select>
  <span>Moves <b id="moves">0</b></span>
  <button id="new">New puzzle</button>
</div>
<div id="board"></div>
<div class="msg" id="msg">Clicking a lamp flips it and its four neighbours. Turn every light off.</div>
<script src="game.js"></script>
</body>
</html>
