<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 Puzzle</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#12141c;color:#e7e9f3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{margin:0;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#c08bff;font-weight:600}
.hud{display:flex;gap:20px;font-size:14px;color:#9aa3c7;font-variant-numeric:tabular-nums;align-items:center}
.hud b{color:#e7e9f3}
button{background:#232741;color:#e7e9f3;border:1px solid #343a5e;border-radius:8px;padding:7px 13px;font:inherit;cursor:pointer}
button:hover{background:#2c3154}
#board{position:relative;width:432px;height:432px;background:#1b1f30;border:1px solid #2a2f4a;border-radius:12px}
.tile{position:absolute;width:96px;height:96px;border-radius:9px;background:#2b3149;color:#e7e9f3;
  display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;cursor:pointer;
  transition:transform 110ms ease-out;will-change:transform}
.tile:hover{background:#353c5c}
.tile.home{background:#3a2f57;color:#d9c2ff}
.msg{min-height:20px;color:#8f98bd;font-size:13px}
</style>
</head>
<body>
<h1>15 Puzzle</h1>
<div class="hud"><span>Moves <b id="moves">0</b></span><span>Time <b id="time">0</b></span><button id="new">Shuffle</button></div>
<div id="board"></div>
<div class="msg" id="msg">Click a tile next to the gap, or use the arrow keys.</div>
<script src="game.js"></script>
</body>
</html>
