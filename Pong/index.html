<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pong</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#12141c;color:#e7e9f3;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
h1{margin:0;font-size:18px;letter-spacing:.28em;text-transform:uppercase;color:#8fb8ff;font-weight:600}
.hud{display:flex;gap:16px;font-size:14px;color:#9aa3c7;align-items:center}
select{background:#232741;color:#e7e9f3;border:1px solid #343a5e;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
canvas{background:#0c0e15;border:1px solid #2a2f4a;border-radius:10px;cursor:none;touch-action:none}
.msg{min-height:20px;color:#8f98bd;font-size:13px}
</style>
</head>
<body>
<h1>Pong</h1>
<div class="hud">
  <select id="diff"><option value="0.24">Relaxed CPU</option><option value="0.14" selected>Normal CPU</option><option value="0.07">Sharp CPU</option></select>
  <span>First to 7</span>
</div>
<canvas id="game" width="720" height="460"></canvas>
<div class="msg" id="msg">Move the mouse or use ↑ ↓. Press Space to serve.</div>
<script src="game.js"></script>
</body>
</html>
